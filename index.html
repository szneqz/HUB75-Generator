<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Image Pixel Reader</title>

<style>
    body {
        margin: 0;
        font-family: monospace;
        background: #121212;
        color: #ddd;
        height: 100vh;
        display: flex;
    }

    .container {
        display: flex;
        width: 100%;
        height: 100%;
        padding: 10px;
        gap: 10px;
        box-sizing: border-box;
    }

    .left {
        width: 35%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .right {
        width: 65%;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    input, button, textarea {
        background: #1e1e1e;
        color: #ddd;
        border: 1px solid #333;
        padding: 6px;
        font-family: monospace;
    }

    button {
        cursor: pointer;
    }

    .row {
        display: flex;
        gap: 8px;
    }

    #preview {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
        image-rendering: pixelated;
        border: 1px solid #333;
        background: #000;
    }

    #output {
        flex: 1;
        width: 99%;
        resize: none;
        white-space: pre;
        overflow: auto;
    }
</style>
</head>

<body>
<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">
        <input type="file" id="fileInput" accept="image/*" />

        <div class="row">
            <button onclick="generate()">Generate code</button>
        </div>

        <img id="preview" />

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">

        <textarea id="output" readonly></textarea>

        <div class="row">
            <button onclick="copyOutput()">Copy Output</button>
            <button onclick="clearOutput()">Clear Output</button>
        </div>

    </div>

</div>

<script>
const preview = document.getElementById("preview");
const output = document.getElementById("output");
const fileInput = document.getElementById("fileInput");

let currentImage = new Image();
let canvas = document.createElement("canvas");
let ctx = canvas.getContext("2d");
let pathUrl = "";

fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    pathUrl = url;
    preview.src = url;

    currentImage = new Image();
    currentImage.src = url;

    output.value = "";
});

// Convert 0..255 -> 0..31
function to5Bit(v) {
    return (v >> 3) & 0x1F;
}

// Pack into:
// RRRRR GGGGG BBBBB
function packRGB555(r, g, b) {

    const r5 = to5Bit(r);
    const g5 = to5Bit(g);
    const b5 = to5Bit(b);

    return (r5 << 10) | (g5 << 5) | b5;
}

function loadAndRead() {

    if (!currentImage.complete || !pathUrl) {
        return "Image not loaded yet";
    }

    canvas.width = currentImage.width;
    canvas.height = currentImage.height;

    ctx.drawImage(currentImage, 0, 0);

    const imgData =
        ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    let result = "{\n";

    for (let y = 0; y < canvas.height; y++) {

        result += "    {";

        for (let x = 0; x < canvas.width; x++) {

            const i = (y * canvas.width + x) * 4;

            const r = imgData[i + 0];
            const g = imgData[i + 1];
            const b = imgData[i + 2];

            const packed = packRGB555(r, g, b);

            result +=
                "{0x"
                + packed
                    .toString(16)
                    .toUpperCase()
                    .padStart(4, '0')
                + "}";

            if (x < canvas.width - 1)
                result += ", ";
        }

        result += "}";

        if (y < canvas.height - 1)
            result += ",\n";
    }

    result += "\n}";

    return result;
}

function generate() {

    output.value = "Calculating... Please wait!";

    setTimeout(() => {
        output.value = loadAndRead();
    }, 10);
}

function copyOutput() {
    navigator.clipboard.writeText(output.value);
}

function clearOutput() {
    output.value = "";
}
</script>

</body>
</html>
